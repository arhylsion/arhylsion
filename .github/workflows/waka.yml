name: Refresh WakaTime Metrics

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-waka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate WakaTime Metrics Cards
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          curl -sSL -O https://raw.githubusercontent.com/arhylsion/ghgraph/main/ghgraph.py
          python3 ghgraph.py --waka --waka-range all_time --waka-limit 5 --waka-scale percent --theme both --output assets/
          rm -f ghgraph.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "chore: sync wakatime metrics cards" && git push)