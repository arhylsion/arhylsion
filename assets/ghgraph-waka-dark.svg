<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 142" width="820" height="142" fill="none">
  <style>
    .gh-wrow { opacity: 0; animation: ghWakaRow 0.42s cubic-bezier(0.2, 0, 0, 1) forwards; }
    .gh-wbar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: ghWakaBar 0.72s cubic-bezier(0.2, 0, 0, 1) forwards; }
    @keyframes ghWakaRow { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ghWakaBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect width="820" height="142" rx="16" fill="#1a181c" stroke="rgba(206, 196, 207, 0.12)" stroke-width="1"/>
  <text x="32" y="46" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="-0.02em">
    <tspan font-weight="700" fill="#ebe4eb">Coding Activity.</tspan>
  </text>
  <g transform="translate(704, 26)">
    <rect width="84" height="24" rx="12" fill="#533571"/>
    <text x="42.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#efddff">ALL TIME</text>
  </g>
  <text x="32" y="102" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a919c">Paste WakaTime stats above (e.g. Python | 65 hrs 29 mins | 19.21) to preview</text>
</svg>