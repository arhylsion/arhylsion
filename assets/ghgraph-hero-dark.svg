<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" width="820" height="236" fill="none">
  <defs>
    <clipPath id="gh-hero-clip"><rect width="820" height="236" rx="16"/></clipPath>
    <filter id="gh-hero-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="52"/></filter>
  </defs>
  <style>
    .gh-badge-link { cursor: pointer; text-decoration: none; }
    .gh-badge-link:hover rect { opacity: 0.85; }
    .gh-orb-a { animation: ghHeroDriftA 13s ease-in-out infinite alternate; }
    .gh-orb-b { animation: ghHeroDriftB 16s ease-in-out infinite alternate; }
    .gh-fade-up { opacity: 0; animation: ghHeroIn 0.55s cubic-bezier(0.2, 0, 0, 1) forwards; }
    @keyframes ghHeroDriftA { from { transform: translate(-25px, -14px); } to { transform: translate(65px, 18px); } }
    @keyframes ghHeroDriftB { from { transform: translate(25px, 12px); } to { transform: translate(-60px, -16px); } }
    @keyframes ghHeroIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="820" height="236" rx="16" fill="#1a181c" stroke="rgba(206, 196, 207, 0.12)" stroke-width="1"/>
  <g clip-path="url(#gh-hero-clip)" filter="url(#gh-hero-blur)">
    <ellipse class="gh-orb-a" cx="700" cy="40" rx="180" ry="70" fill="#d9b9ff" opacity="0.13"/>
    <ellipse class="gh-orb-b" cx="120" cy="220" rx="160" ry="58" fill="#fca5b9" opacity="0.11"/>
  </g>
  <g transform="translate(32, 28)">
    <rect width="44" height="44" rx="12" fill="#533571" stroke="rgba(206, 196, 207, 0.12)" stroke-width="1"/>
    <text x="22" y="29" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#efddff">A</text>
  </g>
  <text x="90" y="47" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ebe4eb">arhylsion</text>
  <circle cx="95" cy="64" r="4" fill="#8af2b3"/>
  <text x="107" y="68" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#9a919c">Indonesia</text>
  <a href="https://arhylsion.github.io/ghgraph/" target="_blank" rel="noopener noreferrer" class="gh-badge-link">
    <g transform="translate(712, 28)">
      <rect width="76" height="24" rx="12" fill="#533571"/>
      <text x="38" y="16" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#efddff">ghgraph</text>
    </g>
  </a>
  <text class="gh-fade-up" x="32" y="144" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" letter-spacing="-0.03em" fill="#ebe4eb" style="animation-delay:0.06s;">I build fast tools that do the work,</text>
  <text class="gh-fade-up" x="32" y="192" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" letter-spacing="-0.03em" fill="#9a919c" style="animation-delay:0.15s;">and the interfaces they live in.</text>
</svg>